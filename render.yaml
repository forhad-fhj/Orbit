services:
  - type: web
    name: social-platform-api
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npm install -g prisma@5.22.0 && npx --yes prisma@5.22.0 generate --schema=./packages/prisma/prisma/schema.prisma && npm run build -w packages/shared-types -w packages/prisma && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
