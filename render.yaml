services:
  - type: web
    name: orbit-api
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: orbit-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false

databases:
  - name: orbit-db
    plan: free

  - name: orbit-redis
    type: redis
    plan: free
    ipAllowList: []
